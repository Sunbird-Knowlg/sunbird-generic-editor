<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunbird Content Editor v2 — Dev</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { width: 100%; height: 100%; }
      body { font-family: system-ui, sans-serif; display: flex; }
      #app { display: flex; flex-direction: column; }
      #dev-toolbar {
        height: 40px; background: #1a1a1a; border-bottom: 1px solid #333;
        display: flex; align-items: center; gap: 10px; padding: 0 12px;
        font-size: 12px; color: #888; flex-shrink: 0;
      }
      #dev-toolbar label { color: #666; font-size: 11px; }
      #dev-toolbar select, #dev-toolbar input {
        padding: 3px 8px; border-radius: 5px; border: 1px solid #333;
        background: #2a2a2a; color: #ccc; font-size: 11px; outline: none;
      }
      #dev-toolbar button {
        padding: 4px 12px; border-radius: 5px; border: none;
        background: #2563eb; color: #fff; cursor: pointer; font-size: 11px; font-weight: 600;
      }
      #editor-root { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="app"><div id="editor-root"></div></div>
    <script type="module" src="/src/dev-harness.tsx"></script>
  </body>
</html>
